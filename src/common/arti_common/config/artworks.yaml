# 작품·안내 구역 (map 프레임, m) — T04. 두 로봇이 같이 쓰는 공용 좌표.
#
# 구역 모양 (shape)
#   semicircle (기본): 중심(x, y)에서 정면 방향(facing_deg, 방 쪽)으로 반지름 radius만큼 펼쳐진 반원.
#                      점 p가 구역 안 = |p - 중심| <= radius 이고, (p - 중심)이 정면 쪽 (벽 뒤쪽 반은 제외)
#   rect             : x_min~x_max, y_min~y_max 직사각형 (map 축에 나란함)
#
# 값 출처 (2026-11-19 통일): 작품·키오스크 반원 = robot4 실물 코스(arti_pc2_nav a_course.yaml, 실측 밑변 기반) 값.
#   두 로봇이 이 파일 하나를 같이 쓴다. 로봇마다 다른 것은 init_pose.yaml(도크·출발 위치)뿐.
#   robot1은 관람객 위치, robot4는 로봇 위치로 같은 반원을 판정한다.
#   facing_deg = a_course.yaml direction(rad)을 도로 바꾼 값.
#   (이전 robot1 값, 2026-11-17 벽면 기준: 그림1 (-2.72, 1.23) r 0.7 … — git 기록 참고)
#   ⚠ 그림4는 반지름 0.43 m로 좁다 — 관람객 위치 판정(robot1)이 잘 안 되면 넓히는 것을 robot4 담당과 협의

# 작품: 관람객이 구역 안에서 멈추면 (artwork_zone 노드의 dwell_time·dwell_radius)
#       explain_artwork 액션으로 설명 재생. artwork_id = 작품 번호(int) — ROS 통신의 작품 ID는 int32로 통일
#       (StartTour, Description, ExplainArtwork, artwork_zone/explaining·explained). PC3 작품 DB 번호와 같다.
artworks:
  - {artwork_id: 1, name: 그림1, x: -2.62,  y: 1.235, facing_deg: 0,      radius: 0.64}     # 왼쪽 벽
  - {artwork_id: 2, name: 그림2, x: -2.52,  y: 3.255, facing_deg: 0,      radius: 0.64}     # 왼쪽 벽
  - {artwork_id: 3, name: 그림3, x: -1.265, y: 5.145, facing_deg: -88.83, radius: 0.64}     # 위쪽 벽
  - {artwork_id: 4, name: 그림4, x: 0.0616, y: 3.665, facing_deg: 174.88, radius: 0.4267}   # 오른쪽 벽

# 안내 구역: 관람객이 들어가면 (멈추지 않아도) guide_message로 안내 음성.
#            guide는 arti_audio guide_lines.yaml의 guides 키.
guide_zones:
  # 출구(종료 구역): 직사각형 (robot1 값, 두 로봇 공통). 가로 = 가운데 벽 오른쪽 면(x -0.82) ~ 오른쪽 바깥벽 안쪽 면(x 0.13),
  #   세로 = 출구 측정 범위 y 0.56~1.11을 그림4 쪽으로 0.8 m 올림 (maps/gallery.pgm 기준, 2026-11-17)
  #   → 2026-11-20 robot1 현장: 도크 쪽으로 0.2 m 내림 (y 1.36~1.91 → 1.16~1.71, 도크 y 0.7과 0.46 m)
  - {zone_id: exit,  name: 출구,     shape: rect, x_min: -0.82, x_max: 0.13, y_min: 1.16, y_max: 1.71, guide: tour_end}
  - {zone_id: kiosk, name: 키오스크, x: -1.0225, y: -0.3345, facing_deg: 91.35, radius: 0.6176, guide: kiosk}   # 아래쪽 벽
