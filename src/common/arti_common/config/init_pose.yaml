# 로봇별 도킹·언독 위치 (map 프레임, m) — T06. 로봇 2대 중 robot1만 사용.
# 측정: 2026-11-17, 사용자가 RViz로 확인한 값. yaw(로봇 방향)는 아직 안 잼.
#
#   dock   : 도크에 붙어 있을 때 로봇 위치 (충전)
#   undock : 언독 직후 위치 (관람 시작·복귀 목표)
#
# 참고: 두 위치 모두 출구 안내 구역(artworks.yaml exit, 중심 (0.17, 0.84) 반지름 0.8 m) 안이다.
#       artwork_zone은 관람객 좌표로 판정하므로, 관람객이 도크 근처에 서 있으면 출구 안내가 나올 수 있다.

robots:
  /robot1:
    dock:   {x: -0.04, y: 0.7}
    undock: {x: -0.3,  y: 0.7}
