# 작품 정보 샘플 — DB가 준비되기 전까지 이 파일을 읽는다. 한 항목 = DB 작품 테이블의 한 행.
#   artwork_id    : ExplainArtwork goal의 artwork_id (예: art_01)
#   artwork_title : 작품 제목
#   artist        : 작가
#   location      : 전시 위치 (구역 이름)
#   theme         : 주제/분류
#   description   : 읽어 줄 설명
#   x, y          : 작품 지도 좌표 (map 프레임, m) — 반원 구역은 arti_common/config/artworks.yaml (같은 값)
# 음성으로 읽는 것은 description뿐 (제목·작가는 읽지 않는다).
# ※ 데모용 가상 작품·작가 (2026-11-17 임의 작성). 실제 작품이 정해지면 교체.

artworks:
  - artwork_id: art_01
    artwork_title: "새벽의 항구"
    artist: "한서윤"
    location: "A구역"
    theme: "풍경"
    description: >-
      해가 뜨기 직전, 고깃배들이 바다로 나가기 전의 고요한 순간을 담았습니다.
      화면 아래쪽의 짙은 남색에서 위쪽의 연한 주황빛으로 색이 천천히 바뀌는 것이 보이시나요?
      작가는 붓 대신 넓은 나이프로 물감을 여러 겹 쌓아 올려, 물결의 반짝임을 표현했습니다.
      가까이에서 보시면 물감의 두께가 만드는 작은 그림자까지 느끼실 수 있습니다.
    x: -2.72
    y: 1.23

  - artwork_id: art_02
    artwork_title: "도시의 숨"
    artist: "이도현"
    location: "B구역"
    theme: "도시"
    description: >-
      수백 개의 가는 선이 겹쳐 빌딩 숲을 이루고, 그 사이로 비어 있는 흰 공간이 바람길처럼 지나갑니다.
      작가는 바쁜 도시에도 사람이 숨 쉴 틈이 있어야 한다는 생각을 이 빈 공간에 담았다고 합니다.
      한 걸음 뒤로 물러나서 보시면, 선들이 모여 커다란 사람의 옆얼굴이 나타납니다.
    x: -2.72
    y: 3.25

  - artwork_id: art_03
    artwork_title: "기억의 정원"
    artist: "박지아"
    location: "C구역"
    theme: "기억"
    description: >-
      작가가 어린 시절 할머니 댁 마당에서 본 꽃과 나무를 떠올리며 그린 그림입니다.
      꽃잎의 모양이 일부러 흐릿하게 그려진 것은, 시간이 지나며 조금씩 흐려지는 기억을 표현한 것입니다.
      하지만 색만큼은 아주 선명하게 남겨 두었는데요, 작가는 그때의 따뜻한 느낌만은 잊히지 않았다고 말합니다.
    x: -1.27
    y: 5.25

  - artwork_id: art_04
    artwork_title: "빛의 계단"
    artist: "최민준"
    location: "D구역"
    theme: "추상"
    description: >-
      여러 겹의 반투명한 사각형이 계단처럼 위로 쌓여 올라갑니다.
      아래쪽은 차분한 회색, 위로 갈수록 밝은 노란빛이 번지는데요, 작가는 하루를 시작하는 마음이 조금씩 밝아지는 과정을 담았다고 합니다.
      조금 옆으로 비켜서서 보시면 사각형들의 겹친 부분이 새로운 색을 만들어 내는 것을 보실 수 있습니다.
    x: 0.12
    y: 3.73
