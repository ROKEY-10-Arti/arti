# guide_audio_node 파라미터 (네임스페이스와 상관없이 적용되도록 /**)
/**:
  ros__parameters:
    # 비우면 설치된 share/arti_audio/config/의 파일 사용
    guide_lines_file: ""          # TTS 목소리, 작품 설명 문장 틀, 안내 문구
    artworks_file: ""             # 작품 정보 (기본 artworks_sample.yaml, 나중에 DB)
    # 합성한 mp3 캐시 (저장소 밖, 커밋 안 함)
    tts_cache_dir: "~/.cache/arti_audio/tts"
    tts_timeout_sec: 10
    prefetch: true                # 시작할 때 안내·작품 설명을 미리 합성
    # 재생 명령 (뒤에 파일 경로가 붙는다). 기본은 PipeWire 기본 출력(노트북 스피커).
    # 음량: "pw-play --volume 0.8"  / 출력 장치 지정(에어팟 등): "pw-play --target <sink 이름>"
    player_cmd: "pw-play"
