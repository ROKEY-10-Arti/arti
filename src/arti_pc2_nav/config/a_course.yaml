# ArtI 코스 좌표 설정 (guided_tour_plan.load_course_config 가 읽음)
# 실측 map 좌표(m), yaw/direction(라디안)
#   goal_pose : Nav2 목표 위치/방향
#   zone      : 도착 판정 반원 (cx,cy 중심 / radius 반지름 / direction 반원이 열린 방향)
#               goal_pose 는 반드시 자기 zone 안에 있어야 함 (아니면 로드 실패)
# /home/rokey/f_project/src/arti_gallery/config/a_course.yaml 실측 밑변/지름 기반 계산값
# 코스 시작 지점 (언도킹 후 가장 먼저 감)
kiosk:
  goal_pose: {x: -1.4460, y: 0.0066, yaw: 1.5944}  # [코스 관람 변경 ⑪] 로봇이 서는 자리 (RViz Publish Point로 찍은 값)
  # ── 왜 이 자리로 바꿨나 (2026-11-20) ─────────────────────────────────────────────
  #   전에는 반원에 들어서는 순간 멈춰서 가장자리 아무 데나 섰다 → 서는 자리·방향이 매번 달라서
  #   등록(스캔) 뒤 관람 시작 때 그림 1 쪽으로 크게 휙 돌았다 (관람객이 따라오기 힘듦).
  #   그래서 "반원 진입"이 아니라 "이 자리까지 가서 선다"로 바꾸고(kiosk_stop_at_goal), 자리는 RViz로 직접 찍었다.
  #   바뀐 기록: (-1.032, 0.0668) 처음 값
  #           → (-1.2154, 0.1336) 실주행: 벽·키오스크에 너무 붙어 Nav2가 0.22 m 앞에서 더 못 들어감 ("Failed to make progress")
  #           → (-1.4460, 0.0066) 지금 값, 벽에서 조금 떨어진 자리로 다시 찍음
  # ── 왜 0.30 m 안이면 도착인가 (kiosk_goal_tolerance, a_course_node 파라미터) ─────────
  #   찍은 자리 근처는 장애물 여유 공간(costmap inflation) 때문에 Nav2가 끝까지 못 들어가거나,
  #   다 와서 미세 조정하다 progress checker로 실패할 수 있다. 그러면 도착 판정이 안 나서 등록으로 못 넘어간다.
  #   → 반원 안 + 찍은 자리 0.30 m 이내면 Nav2를 멈추고 도착으로 본다 (실주행에서 멈춘 0.22 m를 덮는 값).
  #   대신 로봇은 찍은 자리 최대 0.30 m 앞에 설 수 있다. 더 정확히 세우려면 값을 줄인다 (너무 줄이면 다시 못 멈출 수 있음).
  # ── 방향 ──────────────────────────────────────────────────────────────────────────
  #   yaw = zone.direction (반원이 열린 방향, 방 안쪽). 도착 뒤에도 정면을 이 방향으로 맞춘다(kiosk_face_target: plane)
  #   → robot4 웹캠은 뒤(camera_yaw 180)를 보므로 등이 키오스크 면을 똑바로 봄 = 키오스크 앞 관람객이 카메라에 보임.
  #   [변경 ⑦] 처음 yaw -1.5472는 키오스크 벽을 보고 서서 웹캠이 반대쪽을 봤다 → 반대 방향으로 바꿈.
  # ── 주의 ──────────────────────────────────────────────────────────────────────────
  #   goal_pose는 아래 zone 반원 "안"이어야 한다 (밖이면 코스 노드가 설정을 못 읽고 멈춤).
  #   지금 값은 반원 중심에서 0.544 m (반지름 0.618, 가장자리에서 7 cm 안). 확인: ros2 launch arti_pc2_nav zone_view.launch.py
  zone: {cx: -1.0225, cy: -0.3345, radius: 0.6176, direction: 1.5944}   # 도착 확인 범위. 넓힐지는 실주행 보고 결정 (2026-11-20 보류)
# 작품 목록: 이 순서대로 방문. 반원 진입 -> 정지 -> 해설(explain_artwork) -> 다음 작품
# artwork_id = 작품 번호(int) = PC3 DB 번호. 이 번호로 /arti/description 조회, StartTour artwork_ids도 이 번호
artworks:
  - artwork_id: 1
    goal_pose: {x: -2.204, y: 1.235, yaw: 3.1416}
    zone: {cx: -2.62, cy: 1.235, radius: 0.64, direction: 0.0}
  - artwork_id: 2
    goal_pose: {x: -2.104, y: 3.255, yaw: 3.1416}
    zone: {cx: -2.52, cy: 3.255, radius: 0.64, direction: 0.0}
  - artwork_id: 3
    goal_pose: {x: -1.2565, y: 4.7291, yaw: 1.5912}
    zone: {cx: -1.265, cy: 5.145, radius: 0.64, direction: -1.5504}
  - artwork_id: 4
    goal_pose: {x: -0.2146, y: 3.6897, yaw: -0.0893}
    zone: {cx: 0.0616, cy: 3.665, radius: 0.4267, direction: 3.0523}
# --- 실물 로봇 추가 (2026-11-18) ---
# 작품4 이후 출구 목표점(반원 판정 없음, 0.30m 이내 정지 시 도착) -> 인사 -> 도킹
exit:
  goal_pose: {x: -0.345, y: 1.635, yaw: -1.4111}   # 2026-11-19: 공통 출구 직사각형(arti_common artworks.yaml exit, x -0.82~0.13, y 1.36~1.91)의 중심.
                                                   #   지도 빈칸, 벽까지 0.50 m. yaw: 충전 스테이션 방향 (이전 -0.04, 2.04는 직사각형 밖)
  farewell: 'tour_end'   # 출구 도착 안내 키 (arti_audio/config/guide_lines.yaml의 guides)
  # 출구 구역 = arti_common/config/artworks.yaml guide_zones의 exit (follow 팀과 같은 직사각형, 같은 판정 코드).
  #   이 구역 안에 들어와 멈추면 출구 도착. RViz에도 이 직사각형을 그린다. goal_pose는 이 구역 안이어야 함.
  zone: arti_common
dock:
  station: {x: 0.304, y: -0.0957}                 # 충전 스테이션 실측 위치
  approach_pose: {x: -0.35, y: -0.0957, yaw: 0.0}  # 스테이션 정면 약 0.65m 앞(0.5m는 costmap 팽창 때문에 도달 불가), 스테이션(+X)을 바라봄
  # [코스 관람 변경 ⑨] 접근점 반경 0.30 m 안에 들어서자마자 멈추므로 위 yaw까지는 돌지 않는다.
  #   → 멈춘 뒤 정면이 station을 보게 Nav2 spin으로 돌고 Dock (a_course_node dock_face, course_engine FACE_DOCK).
  #   2026-11-20: 출구에서 내려와 남쪽을 보고 선 채 Dock → Create 3가 도크를 찾다 앞 벽에 부딪혀 실패.
  # [코스 관람 변경 ②] AMCL 시작 위치(언독 직후 위치)는 여기가 아니라 arti_common/config/init_pose.yaml robots./robot4.undock (follow 팀과 같은 파일)
