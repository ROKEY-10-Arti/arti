bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12  # ArtI 실물: 작품4 반원(당시 r=0.43, ⑭에서 0.6)이 작아 0.25면 반원 밖에 정지 (기본 0.25)
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      # [코스 관람 변경 ⑮] 회전 최고 속도 1.0 → 0.5 rad/s (약 57°/s → 29°/s, 2026-11-21)
      #   문제점: 현장 시험에서 제자리 회전·방향 전환이 너무 빨랐다.
      #   바꾼 것: 회전 상한 세 곳을 같이 50%로 — DWB max_vel_theta(주행 중 방향 틀기), behavior_server spin
      #           max_rotational_vel(키오스크⑦·도크⑨ 앞 제자리 회전), velocity_smoother 회전 상한(최종 cmd_vel). 하나만 낮추면 나머지가 그대로라
      #           일부 회전만 느려진다. 우리 노드는 cmd_vel을 직접 안 내므로 이 세 값이 모든 회전에 적용된다.
      #   주의:   회전 시간이 약 2배 (180° ≈ 6~7 s, face_timeout 20 s 안). spin min_rotational_vel 0.4는 0.5보다 작아야 한다.
      #           가속도(acc_lim_theta·rotational_acc_lim 3.2)는 그대로.
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      xy_goal_tolerance: 0.25
      path_length_tolerance: 1.0
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      limit_vel_cmd_in_traj: False
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 5.0
      transform_tolerance: 1.0   # 기본 0.3 s. 와이파이·서버 경유로 AMCL map->odom TF가 0.9 s 늦어 Nav2가 바로 실패한 적 있음 (2026-11-19)
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.06
      # [코스 관람 변경 ⑬] footprint 팔각형 반지름 0.189 → 0.28 m (2026-11-21)
      #   문제점: 로봇 위에 올린 노트북(탑캠)이 몸통 밖으로 나와 있어, 주행 중 벽·받침대 모서리에 노트북이 부딪혔다.
      #   원인:   0.189는 TurtleBot 4 몸통 크기뿐. LiDAR는 약 20 cm 높이 한 면만 봐서 노트북을 못 보고,
      #           Nav2는 footprint 크기로만 "닿는지"를 판단한다 (경로 계획·DWB·collision_monitor 모두 이 footprint 사용).
      #   바꾼 것: 노트북까지 감싸는 0.28 m. follow 팀 visitor_follower robot_radius 0.28과 같은 값 (같은 노트북).
      #   주의:   로봇 중심이 벽에서 약 0.26 m(내접 반경) 이상 떨어져야 한다. 지도로 본 여유 — 오른쪽 통로 폭 0.95~1.05 m 통과 가능,
      #           작품 4 goal_pose 벽까지 0.35 m(빠듯 → 다시 찍기), 도킹 접근점 0.30 m(빠듯, 도킹 복귀 현장 확인 필요).
      footprint: "[[ 0.280,  0.000],
                  [ 0.198, -0.198],
                  [ 0.000, -0.280],
                  [-0.198, -0.198],
                  [-0.280,  0.000],
                  [-0.198,  0.198],
                  [ 0.000,  0.280],
                  [ 0.198,  0.198]]"
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        # 팽창 반경(m). cost_scaling_factor를 높이면 장애물에서 멀어질수록 비용이 빠르게 감소한다.
        # [코스 관람 변경 ⑬] inflation_radius 0.22 → 0.45 m (2026-11-21)
        #   문제점: 두 로봇이 같이 다니는데, 다른 로봇(robot1)도 같은 노트북을 올려 LiDAR에 보이는 몸통보다 약 10 cm 더 크다.
        #           상대 노트북은 LiDAR에 안 보이므로 footprint만 키워서는 그 부분과 부딪힐 수 있다.
        #   바꾼 것: 장애물 주변 "비용 구역"을 넓혀 경로가 벽·다른 로봇에서 더 떨어져 지나가게 함 (막는 게 아니라 멀리 돌게 유도).
        #   주의:   inflation_radius는 footprint 내접 반경(0.28 × cos 22.5° ≈ 0.26)보다 커야 한다. 0.22로 두면 Nav2가 경고하고
        #           팽창이 몸통 안에서 끝나 효과가 없다.
        inflation_radius: 0.45
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 1.0
      transform_tolerance: 1.0   # 기본 0.3 s. 와이파이·서버 경유로 AMCL map->odom TF가 0.9 s 늦어 Nav2가 바로 실패한 적 있음 (2026-11-19)
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # [코스 관람 변경 ⑬] footprint 팔각형 반지름 0.189 → 0.28 m (2026-11-21)
      #   문제점: 로봇 위에 올린 노트북(탑캠)이 몸통 밖으로 나와 있어, 주행 중 벽·받침대 모서리에 노트북이 부딪혔다.
      #   원인:   0.189는 TurtleBot 4 몸통 크기뿐. LiDAR는 약 20 cm 높이 한 면만 봐서 노트북을 못 보고,
      #           Nav2는 footprint 크기로만 "닿는지"를 판단한다 (경로 계획·DWB·collision_monitor 모두 이 footprint 사용).
      #   바꾼 것: 노트북까지 감싸는 0.28 m. follow 팀 visitor_follower robot_radius 0.28과 같은 값 (같은 노트북).
      #   주의:   로봇 중심이 벽에서 약 0.26 m(내접 반경) 이상 떨어져야 한다. 지도로 본 여유 — 오른쪽 통로 폭 0.95~1.05 m 통과 가능,
      #           작품 4 goal_pose 벽까지 0.35 m(빠듯 → 다시 찍기), 도킹 접근점 0.30 m(빠듯, 도킹 복귀 현장 확인 필요).
      footprint: "[[ 0.280,  0.000],
                  [ 0.198, -0.198],
                  [ 0.000, -0.280],
                  [-0.198, -0.198],
                  [-0.280,  0.000],
                  [-0.198,  0.198],
                  [ 0.000,  0.280],
                  [ 0.198,  0.198]]"
      resolution: 0.06
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        # 팽창 반경(m). cost_scaling_factor를 높이면 장애물에서 멀어질수록 비용이 빠르게 감소한다.
        # [코스 관람 변경 ⑬] inflation_radius 0.22 → 0.45 m (2026-11-21)
        #   문제점: 두 로봇이 같이 다니는데, 다른 로봇(robot1)도 같은 노트북을 올려 LiDAR에 보이는 몸통보다 약 10 cm 더 크다.
        #           상대 노트북은 LiDAR에 안 보이므로 footprint만 키워서는 그 부분과 부딪힐 수 있다.
        #   바꾼 것: 장애물 주변 "비용 구역"을 넓혀 경로가 벽·다른 로봇에서 더 떨어져 지나가게 함 (막는 게 아니라 멀리 돌게 유도).
        #   주의:   inflation_radius는 footprint 내접 반경(0.28 × cos 22.5° ≈ 0.26)보다 커야 한다. 0.22로 두면 Nav2가 경고하고
        #           팽창이 몸통 안에서 끝나 효과가 없다.
        inflation_radius: 0.45
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    #expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # [코스 관람 변경 ⑮] 1.0 → 0.5 (회전이 너무 빠름. 이유는 controller_server FollowPath max_vel_theta 주석)
    max_rotational_vel: 0.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # [코스 관람 변경 ⑮] 회전(세 번째 값) ±1.0 → ±0.5 (회전이 너무 빠름. 이유는 controller_server FollowPath max_vel_theta 주석)
    max_velocity: [0.26, 0.0, 0.5]
    min_velocity: [-0.26, 0.0, -0.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15

lifecycle_manager_navigation:
  ros__parameters:
    bond_timeout: 30.0   # [코스 관람 변경 ⑥] 기본 10 s. 서버 PC 경유 discovery가 느려 controller_server bond가 10 s 안에 안 와서 Nav2 bringup이 중간에 멈춘 적 있음 (2026-11-19)
